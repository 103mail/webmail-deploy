# The client from the Vite dev server in ../webmail-client, for development
# (docker-compose.dev.yml). It stays behind nginx, so the bundle keeps the
# Domain's origin, /config.json and API. The HMR WebSocket comes in on the same
# origin and is passed through.

location / {
    set $vite_upstream http://vite:5173;
    proxy_pass $vite_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header Host       $http_host;
    proxy_read_timeout 3600s;
}
